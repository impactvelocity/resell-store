<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>resell.store demo — composition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fffdf2; color: #14261d; font-family: Figtree, sans-serif; -webkit-font-smoothing: antialiased; }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .content { position: absolute; inset: 0; }
  .display { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; letter-spacing: -0.035em; line-height: 0.98; }
  .shot img { display: block; user-select: none; }
  .url { background: #fff; border: 2px solid #e8e3c8; border-radius: 999px; padding: 6px 22px; font: 600 20px Figtree, sans-serif; color: #14261d; }
  .ring { position: absolute; border: 5px solid #ff5fa8; border-radius: 18px; box-shadow: 0 0 0 6px rgba(255, 95, 168, 0.18); pointer-events: none; }
  .cursor { position: absolute; transform-origin: 6px 3px; margin: -3px 0 0 -6px; filter: drop-shadow(0 4px 6px rgba(20, 38, 29, 0.35)); z-index: 5; }
  .ripple { position: absolute; border: 4px solid #ff5fa8; border-radius: 50%; z-index: 4; }
  .caption { position: absolute; display: flex; align-items: center; gap: 16px; max-width: 1180px; background: #14261d; color: #fffdf2; padding: 22px 34px 24px; border-radius: 26px; font: 800 44px/1.12 "Bricolage Grotesque", sans-serif; letter-spacing: -0.02em; box-shadow: 0 24px 50px -24px rgba(20, 38, 29, 0.6); z-index: 20; }
  .caption .spark { display: flex; flex-shrink: 0; }
  .src { font: 500 22px Figtree, sans-serif; color: #56675e; }
  .pill { display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; font: 700 30px Figtree, sans-serif; }
  .wordmark { display: inline-flex; align-items: baseline; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
  .wordmark .dot { display: inline-block; width: 0.34em; height: 0.34em; margin: 0 0.06em; border-radius: 50%; background: #ffd934; }
  .art svg, .pp svg { display: block; }
  .card { position: absolute; background: #fff; border-radius: 28px; border: 2px solid #e8e3c8; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .hl { position: relative; display: inline-block; z-index: 0; }
  .hl::after { content: none; }
  .stamp { position: absolute; padding: 10px 46px 18px; border: 12px solid #c9246f; border-radius: 28px; color: #c9246f; background: rgba(255, 220, 235, 0.92); font: 800 190px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -0.03em; z-index: 70; white-space: nowrap; box-shadow: 0 30px 60px -20px rgba(201, 36, 111, 0.5); }
  .sticker { position: absolute; padding: 12px 24px; border-radius: 18px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; box-shadow: 0 16px 30px -14px rgba(20, 38, 29, 0.5); z-index: 40; }
  .hl > i { position: absolute; left: -0.08em; right: -0.08em; bottom: 0.06em; height: 0.36em; background: var(--hl, #ffd934); z-index: -1; transform-origin: 0 50%; border-radius: 0.12em; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="engine.js"></script>
<script src="scenes.js"></script>
</body>
</html>
