# Render Blueprint: the Next.js app and its Postgres (pgvector).
# Stores are subdomains, so add both resell.store and *.resell.store as custom domains.
services:
  - type: web
    name: resell-store
    runtime: node
    plan: starter
    region: oregon
    # Render's own install uses its bundled pnpm; corepack gives us the version pinned in package.json.
    # Run pnpm through corepack: `corepack enable` fails because /usr/bin is read-only on Render.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter app build
    # npm only runs the package scripts here, so these don't depend on corepack at runtime
    preDeployCommand: cd packages/db && npm run db:migrate
    startCommand: cd apps/app && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Lets corepack fetch the pinned pnpm without an interactive prompt
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: resell-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://resell.store
      # Inlined at build time: change it, then redeploy
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        value: resell.store
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: resell.store <hello@resell.store>
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: anthropic:claude-sonnet-5
      - key: AI_MODEL_FAST
        value: anthropic:claude-haiku-4-5
      - key: R2_URL
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: resell-store
      - key: R2_PUBLIC_URL
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: JINA_EMBEDDING_MODEL_KEY
        sync: false
      - key: JINA_EMBEDDING_MODEL
        value: jina-embeddings-v5-text-small
      - key: KERNEL_API_KEY
        sync: false
      # "true" offers the shared demo accounts on the sign-in page (lib/server/demo.ts)
      - key: DEMO
        sync: false

databases:
  - name: resell-db
    plan: basic-256mb
    region: oregon
    databaseName: resell
    user: resell
    postgresMajorVersion: "17"
