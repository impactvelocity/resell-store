# Render Blueprint: the Next.js app and its Postgres (pgvector).
# Stores are subdomains, so add both resell.store and *.resell.store as custom domains.
# The wildcard also covers api., docs. and mcp.resell.store, which proxy.ts routes
# to the public API (/api/v1), the docs (/docs) and the MCP servers (/api/mcp).
services:
  - type: web
    name: resell-store
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter app build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter app start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: resell-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: anthropic:claude-sonnet-5
      - key: AI_MODEL_FAST
        value: anthropic:claude-haiku-4-5
      - key: R2_URL
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: resell-store
      - key: R2_PUBLIC_URL
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: JINA_EMBEDDING_MODEL_KEY
        sync: false
      - key: JINA_EMBEDDING_MODEL
        value: jina-embeddings-v5-text-small
      # PayPal multiparty. Without the client id, secret and partner id, checkout is a test checkout
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: PAYPAL_BN_CODE
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_DEMO_SELLER_ID
        sync: false
      - key: PAYPAL_DEMO_SELLER_EMAIL
        sync: false
      - key: PAYPAL_DEMO_SELLER_PASSWORD
        sync: false
      - key: PAYPAL_DEMO_BUYER_EMAIL
        sync: false
      - key: PAYPAL_DEMO_BUYER_PASSWORD
        sync: false
      - key: PLATFORM_FEE_BPS
        sync: false
      - key: PAYOUT_DEMO_MINUTES_PER_DAY
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_LOGO_DEV_TOKEN
        sync: false

  # The timed side of offers and orders (apps/app/lib/server/sweeps.ts) as a
  # Render Workflow: expire offers, reminders, auto-cancel, arrival checks,
  # releasing held money to sellers. Tasks: offerSweep, orderSweep, digestSweep, webhookSweep,
  # releaseOrder, cancelUnshipped (apps/app/workflows/main.ts).
  - type: workflow
    name: resell-sweeps
    runtime: node
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter app workflows
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: resell-db
          property: connectionString
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        sync: false
      # The sweeps share code with the web app, which sets up auth on import
      - key: BETTER_AUTH_SECRET
        fromService:
          type: web
          name: resell-store
          envVarKey: BETTER_AUTH_SECRET
      - key: BETTER_AUTH_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: PAYPAL_BN_CODE
        sync: false
      - key: PAYPAL_DEMO_SELLER_ID
        sync: false
      - key: PLATFORM_FEE_BPS
        sync: false
      - key: PAYOUT_DEMO_MINUTES_PER_DAY
        sync: false

  # Workflows can't schedule themselves yet: this starts the sweeps every 15 minutes.
  - type: cron
    name: resell-sweeps-cron
    runtime: node
    region: oregon
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter app sweeps:start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: resell-sweeps
          property: slug

databases:
  - name: resell-db
    plan: basic-256mb
    databaseName: resell
    user: resell
    postgresMajorVersion: "17"
