<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#fff6c2"/>
  <!-- five figures in a row; each is drawn around its own feet at (0 0) -->
  <g transform="translate(200 200) scale(0.9) translate(-200 -200)">

  <!-- knight -->
  <g transform="translate(84 268)">
    <rect x="-21" y="-28" width="19" height="28" rx="3" fill="#14261d"/><rect x="2" y="-28" width="19" height="28" rx="3" fill="#14261d"/>
    <rect x="-21" y="-38" width="42" height="12" rx="2" fill="#14261d"/>
    <path d="M-17 -70 L-24 -46" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <path d="M17 -70 L24 -46" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-25" cy="-41" r="5.5" fill="#ffd934"/><circle cx="25" cy="-41" r="5.5" fill="#ffd934"/>
    <path d="M-16 -74 H16 L21 -40 H-21 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 -68 V-46 M-9 -60 H9" fill="none" stroke="#d9391b" stroke-width="5" stroke-linecap="round"/>
    <rect x="-15" y="-108" width="30" height="32" rx="11" fill="#ffd934"/>
    <!-- helmet with face opening and nose guard -->
    <path d="M-18 -80 V-104 Q-18 -122 0 -122 Q18 -122 18 -104 V-80 H11 V-100 H-11 V-80 Z" fill="#ffffff"/>
    <rect x="-2" y="-101" width="4" height="10" rx="2" fill="#ffffff"/>
    <circle cx="-6" cy="-94" r="2.5" fill="#14261d"/><circle cx="6" cy="-94" r="2.5" fill="#14261d"/>
    <path d="M-5 -86 Q0 -82 5 -86" fill="none" stroke="#14261d" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- astronaut -->
  <g transform="translate(142 268)">
    <rect x="-21" y="-28" width="19" height="28" rx="3" fill="#8cc9a4"/><rect x="2" y="-28" width="19" height="28" rx="3" fill="#8cc9a4"/>
    <rect x="-21" y="-38" width="42" height="12" rx="2" fill="#8cc9a4"/>
    <path d="M-17 -70 L-24 -46" fill="none" stroke="#8cc9a4" stroke-width="10" stroke-linecap="round"/>
    <path d="M17 -70 L24 -46" fill="none" stroke="#8cc9a4" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-25" cy="-41" r="5.5" fill="#ffd934"/><circle cx="25" cy="-41" r="5.5" fill="#ffd934"/>
    <path d="M-16 -74 H16 L21 -40 H-21 Z" fill="#8cc9a4" stroke="#8cc9a4" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-8" y="-66" width="16" height="10" rx="2" fill="#ffffff"/>
    <!-- open-face helmet behind the head -->
    <rect x="-20" y="-120" width="40" height="46" rx="16" fill="#ffffff"/>
    <rect x="-15" y="-108" width="30" height="30" rx="11" fill="#ffd934"/>
    <circle cx="-6" cy="-95" r="2.5" fill="#14261d"/><circle cx="6" cy="-95" r="2.5" fill="#14261d"/>
    <path d="M-5 -87 Q0 -83 5 -87" fill="none" stroke="#14261d" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- pirate -->
  <g transform="translate(200 268)">
    <rect x="-21" y="-28" width="19" height="28" rx="3" fill="#14261d"/><rect x="2" y="-28" width="19" height="28" rx="3" fill="#14261d"/>
    <rect x="-21" y="-38" width="42" height="12" rx="2" fill="#14261d"/>
    <path d="M-17 -70 L-24 -46" fill="none" stroke="#d9391b" stroke-width="10" stroke-linecap="round"/>
    <path d="M17 -70 L24 -46" fill="none" stroke="#d9391b" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-25" cy="-41" r="5.5" fill="#ffd934"/><circle cx="25" cy="-41" r="5.5" fill="#ffd934"/>
    <path d="M-16 -74 H16 L21 -40 H-21 Z" fill="#d9391b" stroke="#d9391b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-15 -66 L15 -50" fill="none" stroke="#14261d" stroke-width="4" stroke-linecap="round"/>
    <rect x="-15" y="-108" width="30" height="32" rx="11" fill="#ffd934"/>
    <circle cx="-6" cy="-94" r="2.5" fill="#14261d"/><circle cx="6" cy="-94" r="4.5" fill="#14261d"/>
