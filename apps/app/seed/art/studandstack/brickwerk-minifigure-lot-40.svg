      <rect x="-15" y="-114" width="30" height="12" rx="3"/>
      <circle cx="-9" cy="-122" r="10"/><circle cx="9" cy="-122" r="10"/><circle cx="0" cy="-130" r="10"/>
    </g>
  </g>

  <!-- gardener -->
  <g transform="translate(316 268)">
    <rect x="-21" y="-28" width="19" height="28" rx="3" fill="#256b4c"/><rect x="2" y="-28" width="19" height="28" rx="3" fill="#256b4c"/>
    <rect x="-21" y="-38" width="42" height="12" rx="2" fill="#256b4c"/>
    <path d="M-17 -70 L-24 -46" fill="none" stroke="#256b4c" stroke-width="10" stroke-linecap="round"/>
    <path d="M17 -70 L24 -46" fill="none" stroke="#256b4c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-25" cy="-41" r="5.5" fill="#ffd934"/><circle cx="25" cy="-41" r="5.5" fill="#ffd934"/>
    <path d="M-16 -74 H16 L21 -40 H-21 Z" fill="#256b4c" stroke="#256b4c" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-9" y="-66" width="18" height="14" rx="3" fill="#8cc9a4"/>
    <rect x="-15" y="-108" width="30" height="32" rx="11" fill="#ffd934"/>
    <circle cx="-6" cy="-94" r="2.5" fill="#14261d"/><circle cx="6" cy="-94" r="2.5" fill="#14261d"/>
    <path d="M-5 -86 Q0 -82 5 -86" fill="none" stroke="#14261d" stroke-width="2.5" stroke-linecap="round"/>
