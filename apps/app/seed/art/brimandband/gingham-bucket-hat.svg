<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#ddf0e3"/>
  <!-- gingham: mint squares on white -->
  <defs>
    <pattern id="bucket-gingham" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#ffffff"/>
      <rect width="16" height="16" fill="#8cc9a4"/>
      <rect x="16" y="16" width="16" height="16" fill="#8cc9a4"/>
    </pattern>
  </defs>
  <!-- rounded crown -->
  <path d="M124 226 L136 142 Q140 116 166 116 H234 Q260 116 264 142 L276 226 Z" fill="url(#bucket-gingham)"/>
  <!-- short sloping brim -->
  <path d="M124 214 H276 Q284 214 290 222 L330 280 Q336 292 322 296 Q200 324 78 296 Q64 292 70 280 L110 222 Q116 214 124 214 Z" fill="url(#bucket-gingham)"/>
  <!-- seam where crown meets brim -->
  <path d="M120 218 H280" fill="none" stroke="#256b4c" stroke-width="5" stroke-linecap="round"/>
  <!-- rows of stitching on the brim -->
  <g fill="none" stroke="#256b4c" stroke-width="3" stroke-linecap="round">
    <path d="M106 240 Q200 250 294 240"/>
    <path d="M94 258 Q200 272 306 258"/>
    <path d="M82 276 Q200 294 318 276"/>
  </g>
</svg>
