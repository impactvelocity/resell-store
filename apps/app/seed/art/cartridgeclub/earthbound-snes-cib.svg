    <path d="M122 142 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z"/>
    <path d="M246 150 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 Z"/>
    <circle cx="160" cy="126" r="3"/><circle cx="214" cy="132" r="3"/><circle cx="114" cy="198" r="3"/><circle cx="252" cy="206" r="3"/><circle cx="236" cy="176" r="2.5"/>
  </g>
  <!-- backpack and straps -->
  <rect x="140" y="220" width="34" height="50" rx="10" fill="#ffd934"/>
