<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#ddf0e3"/>
  <!-- box -->
  <rect x="92" y="66" width="180" height="266" rx="10" fill="#14261d"/>
  <!-- title -->
  <rect x="108" y="82" width="92" height="10" rx="5" fill="#ffffff"/>
  <rect x="108" y="99" width="58" height="8" rx="4" fill="#ffffff"/>
  <!-- planet -->
  <circle cx="240" cy="98" r="16" fill="#8cc9a4"/>
  <path d="M218 106 Q240 92 262 90" fill="none" stroke="#ff5fa8" stroke-width="5" stroke-linecap="round"/>
  <!-- stars -->
