  <path d="M152 184 Q152 154 182 154 Q212 154 212 184 Z" fill="#d9391b"/>
  <rect x="196" y="176" width="40" height="10" rx="5" fill="#d9391b"/>
  <circle cx="178" cy="198" r="3.5" fill="#14261d"/>
  <circle cx="196" cy="198" r="3.5" fill="#14261d"/>
  <path d="M180 208 Q187 214 194 208" fill="none" stroke="#14261d" stroke-width="3.5" stroke-linecap="round"/>
  <!-- hill -->
  <path d="M92 292 Q182 252 272 292 V322 Q272 332 262 332 H102 Q92 332 92 322 Z" fill="#256b4c"/>
  <!-- player's guide leaning on the box -->
  <g transform="rotate(-8 280 334)">
    <rect x="248" y="196" width="64" height="138" rx="5" fill="#ff5fa8"/>
    <rect x="258" y="210" width="40" height="8" rx="4" fill="#ffffff"/>
    <rect x="258" y="224" width="26" height="6" rx="3" fill="#ffffff"/>
