  <rect x="66" y="82" width="268" height="152" rx="18" fill="#14261d"/>
  <path d="M70 200 H330" fill="none" stroke="#ddf0e3" stroke-width="4" stroke-linecap="round"/>
  <!-- vents -->
  <g fill="none" stroke="#256b4c" stroke-width="6" stroke-linecap="round">
    <path d="M92 116 H138 M92 134 H138 M92 152 H138 M92 170 H138"/>
  </g>
  <!-- recessed circle and cartridge slot -->
  <ellipse cx="236" cy="142" rx="72" ry="44" fill="none" stroke="#256b4c" stroke-width="6"/>
  <ellipse cx="236" cy="142" rx="50" ry="28" fill="none" stroke="#256b4c" stroke-width="4"/>
  <rect x="204" y="134" width="64" height="16" rx="8" fill="#256b4c"/>
