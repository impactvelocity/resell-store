  <rect x="126" y="212" width="26" height="9" rx="4.5" fill="#256b4c"/>
  <!-- three-button controller -->
  <g transform="translate(200 290) scale(0.72) translate(-200 -290)">
    <path d="M130 250 H270 C306 250 318 276 312 300 C306 324 284 332 266 324 C252 318 244 306 230 306 H170 C156 306 148 318 134 324 C116 332 94 324 88 300 C82 276 94 250 130 250 Z" fill="#14261d"/>
    <circle cx="134" cy="284" r="26" fill="#256b4c"/>
    <rect x="127" y="266" width="14" height="36" rx="3" fill="#14261d"/>
    <rect x="116" y="277" width="36" height="14" rx="3" fill="#14261d"/>
    <rect x="186" y="270" width="28" height="10" rx="5" fill="#ffd934"/>
    <circle cx="238" cy="292" r="12" fill="#ff5fa8"/>
    <circle cx="262" cy="280" r="12" fill="#ff5fa8"/>
    <circle cx="286" cy="268" r="12" fill="#ff5fa8"/>
  </g>
</svg>
