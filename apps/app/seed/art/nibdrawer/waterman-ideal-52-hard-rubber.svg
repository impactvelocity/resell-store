<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#ddf0e3"/>
  <!-- the pen, capped, lying almost flat -->
  <g transform="rotate(10 200 200)">
    <!-- barrel, flat end -->
    <rect x="176" y="177" width="160" height="46" rx="7" fill="#14261d"/>
    <!-- cap, flat end -->
    <rect x="64" y="174" width="124" height="52" rx="7" fill="#14261d"/>
    <!-- chased pattern -->
    <g fill="none" stroke="#256b4c" stroke-width="3" stroke-linecap="round">
      <path d="M78 188 q6 -5 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
      <path d="M78 200 q6 -5 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
      <path d="M78 212 q6 -5 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
      <path d="M200 188 q6 -5 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
      <path d="M200 212 q6 -5 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
    </g>
    <!-- band near the cap lip -->
    <rect x="174" y="174" width="6" height="52" fill="#ffd934"/>
    <!-- side lever -->
    <rect x="226" y="195" width="58" height="10" rx="5" fill="#ffd934"/>
    <rect x="278" y="192" width="10" height="16" rx="4" fill="#ffd934"/>
    <!-- long clip -->
    <rect x="72" y="168" width="96" height="10" rx="5" fill="#ffd934"/>
  </g>
</svg>
