<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#ddf0e3"/>
  <!-- the pen, capped, rising to the right -->
  <g transform="rotate(-24 200 200)">
    <!-- barrel, rounded end -->
    <path d="M186 177 H308 Q334 177 334 200 Q334 223 308 223 H186 Z" fill="#c9246f"/>
    <!-- cap, rounded end -->
    <path d="M190 175 V225 H92 Q66 225 66 200 Q66 175 92 175 Z" fill="#c9246f"/>
    <!-- translucent band through the middle -->
    <rect x="80" y="194" width="94" height="12" rx="6" fill="#ff5fa8"/>
    <rect x="202" y="194" width="118" height="12" rx="6" fill="#ff5fa8"/>
    <!-- cap ring -->
    <rect x="178" y="175" width="10" height="50" fill="#ffd934"/>
    <!-- ball-tipped clip -->
    <rect x="92" y="166" width="70" height="10" rx="5" fill="#ffd934"/>
    <circle cx="162" cy="172" r="8" fill="#ffd934"/>
  </g>
</svg>
