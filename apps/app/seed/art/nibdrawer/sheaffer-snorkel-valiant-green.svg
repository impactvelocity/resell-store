<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#ddf0e3"/>
  <!-- the pen, uncapped, nib to the left, cap posted on the end -->
  <!-- snorkel tube, poking out under the nib -->
  <path d="M64 213 H120" fill="none" stroke="#14261d" stroke-width="5" stroke-linecap="round"/>
  <!-- conical section -->
  <path d="M146 178 L84 194 Q74 200 84 206 L146 222 Z" fill="#256b4c"/>
  <!-- inlaid nib with its slit -->
  <path d="M136 189 L70 198 Q66 200 70 202 L136 209 Q142 199 136 189 Z" fill="#ffd934"/>
  <path d="M76 200 H106" fill="none" stroke="#14261d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="110" cy="200" r="3" fill="#14261d"/>
  <!-- barrel -->
  <rect x="142" y="176" width="110" height="48" rx="4" fill="#8cc9a4"/>
  <!-- cap, posted on the back -->
  <path d="M238 170 H314 Q338 170 338 194 V206 Q338 230 314 230 H238 Z" fill="#8cc9a4"/>
  <rect x="236" y="170" width="12" height="60" rx="3" fill="#ffd934"/>
  <!-- clip, pointing back toward the nib -->
  <rect x="262" y="165" width="70" height="10" rx="5" fill="#ffd934"/>
  <circle cx="266" cy="170" r="7" fill="#ffd934"/>
</svg>
