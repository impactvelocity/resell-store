  <!-- spine edge -->
  <path d="M146 74 H154 V326 H146 Q138 326 138 318 V82 Q138 74 146 74 Z" fill="#c9246f"/>
  <!-- two geese flying: body, neck and head, tail, raised wing -->
  <g fill="#14261d">
