      <ellipse cx="0" cy="0" rx="15" ry="6"/>
      <path d="M10 -2 L26 -9" fill="none" stroke="#14261d" stroke-width="5" stroke-linecap="round"/>
      <circle cx="28" cy="-10" r="4.5"/>
      <path d="M31 -12 L38 -10 L31 -7 Z"/>
      <path d="M-13 -2 L-22 -6 L-20 4 Z"/>
      <path d="M6 -4 C4 -16 -6 -26 -18 -30 C-12 -20 -10 -10 -8 -3 Z"/>
    </g>
    <g transform="translate(224 150) scale(0.85)">
      <ellipse cx="0" cy="0" rx="15" ry="6"/>
      <path d="M10 -2 L26 -9" fill="none" stroke="#14261d" stroke-width="5" stroke-linecap="round"/>
      <circle cx="28" cy="-10" r="4.5"/>
      <path d="M31 -12 L38 -10 L31 -7 Z"/>
      <path d="M-13 -2 L-22 -6 L-20 4 Z"/>
      <path d="M6 -4 C4 -16 -6 -26 -18 -30 C-12 -20 -10 -10 -8 -3 Z"/>
    </g>
  </g>
  <!-- soft horizon -->
  <path d="M166 240 Q200 230 248 240" fill="none" stroke="#256b4c" stroke-width="5" stroke-linecap="round"/>
  <!-- title bars, low on the jacket -->
  <rect x="172" y="272" width="64" height="9" rx="4.5" fill="#14261d"/>
  <rect x="172" y="290" width="40" height="7" rx="3.5" fill="#14261d"/>
</svg>
