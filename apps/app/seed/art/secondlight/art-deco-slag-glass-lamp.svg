<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#fff6c2"/>
  <!-- slender stem -->
  <rect x="190" y="190" width="20" height="112" rx="4" fill="#14261d"/>
  <rect x="180" y="236" width="40" height="12" rx="6" fill="#14261d"/>
  <!-- stepped base -->
  <rect x="152" y="298" width="96" height="16" rx="6" fill="#14261d"/>
  <rect x="128" y="312" width="144" height="20" rx="8" fill="#14261d"/>
  <!-- pull chain with bead -->
  <path d="M238 192 V226" fill="none" stroke="#ffd934" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 7"/>
  <circle cx="238" cy="232" r="6" fill="#ffd934"/>
  <!-- six-sided shade: three glass panels seen from the front -->
  <path d="M174 86 H226 L312 186 H88 Z" fill="#f5be0b" stroke="#f5be0b" stroke-width="8" stroke-linejoin="round"/>
  <!-- slag swirls in the glass -->
  <g fill="none" stroke="#fff6c2" stroke-width="5" stroke-linecap="round">
    <path d="M118 166 C130 150 140 160 152 140"/>
    <path d="M186 110 C200 100 206 120 216 108"/>
    <path d="M176 160 C192 140 210 168 228 146"/>
    <path d="M250 140 C260 156 272 150 282 168"/>
  </g>
  <!-- metal frames between the panels -->
  <g fill="none" stroke="#14261d" stroke-width="6" stroke-linecap="round">
    <path d="M184 88 L150 184"/>
    <path d="M216 88 L250 184"/>
  </g>
  <!-- rim and cap -->
  <rect x="82" y="180" width="236" height="16" rx="8" fill="#14261d"/>
  <rect x="164" y="76" width="72" height="16" rx="8" fill="#14261d"/>
  <circle cx="200" cy="66" r="8" fill="#14261d"/>
</svg>
