<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#fff6c2"/>
  <!-- cord hanging from the wall plate -->
  <path d="M96 196 C96 250 132 262 128 300 C126 318 110 326 100 336" fill="none" stroke="#14261d" stroke-width="5" stroke-linecap="round"/>
  <!-- two-part arm -->
  <path d="M96 168 L178 118 L248 168" fill="none" stroke="#f5be0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- round wall plate -->
  <circle cx="96" cy="168" r="32" fill="#ffd934"/>
  <circle cx="96" cy="168" r="12" fill="#f5be0b"/>
  <!-- joints -->
  <circle cx="178" cy="118" r="12" fill="#f5be0b"/>
  <!-- cone shade, tilted down and away from the wall -->
  <g transform="translate(250 166) rotate(-24)">
    <rect x="-12" y="-6" width="24" height="16" rx="5" fill="#f5be0b"/>
    <path d="M-16 8 H16 L58 92 H-58 Z" fill="#ffd934"/>
    <ellipse cx="0" cy="92" rx="58" ry="14" fill="#ffffff"/>
  </g>
  <circle cx="248" cy="168" r="10" fill="#f5be0b"/>
</svg>
