<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#ddf0e3"/>
  <!-- tiny red tab peeking from the back pocket edge -->
  <rect x="272" y="110" width="16" height="12" rx="3" fill="#d9391b"/>
  <!-- legs -->
  <path d="M126 86 H274 L286 330 Q286 338 278 338 H214 Q206 338 206 330 L200 178 L194 330 Q194 338 186 338 H122 Q114 338 114 330 Z" fill="#8cc9a4"/>
  <!-- waistband -->
  <rect x="124" y="62" width="152" height="28" rx="6" fill="#8cc9a4"/>
  <path d="M128 90 H272" fill="none" stroke="#256b4c" stroke-width="4" stroke-linecap="round"/>
  <!-- belt loops -->
  <path d="M146 58 V94 M254 58 V94" fill="none" stroke="#256b4c" stroke-width="5" stroke-linecap="round"/>
  <!-- front pocket openings -->
  <path d="M154 92 Q158 128 122 134 M246 92 Q242 128 278 134" fill="none" stroke="#256b4c" stroke-width="4" stroke-linecap="round"/>
  <!-- coin pocket -->
  <path d="M232 94 V112 H252" fill="none" stroke="#256b4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- fly stitching -->
  <path d="M214 92 V150 Q214 168 200 174" fill="none" stroke="#256b4c" stroke-width="4" stroke-linecap="round"/>
  <!-- top button and the button fly -->
  <circle cx="200" cy="76" r="7" fill="#ffd934"/>
  <g fill="#ffd934">
    <circle cx="205" cy="106" r="4"/><circle cx="205" cy="126" r="4"/><circle cx="205" cy="146" r="4"/>
  </g>
  <!-- hems -->
  <path d="M120 324 H188 M212 324 H280" fill="none" stroke="#256b4c" stroke-width="4" stroke-linecap="round"/>
</svg>
