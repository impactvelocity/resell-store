<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- five-petal flowers -->
    <g id="pinkflower" fill="#ff5fa8">
      <circle cx="0" cy="-6" r="5"/><circle cx="5.7" cy="-1.9" r="5"/><circle cx="3.5" cy="4.9" r="5"/><circle cx="-3.5" cy="4.9" r="5"/><circle cx="-5.7" cy="-1.9" r="5"/>
      <circle r="3" fill="#c9246f"/>
    </g>
    <g id="deepflower" fill="#c9246f">
      <circle cx="0" cy="-6" r="5"/><circle cx="5.7" cy="-1.9" r="5"/><circle cx="3.5" cy="4.9" r="5"/><circle cx="-3.5" cy="4.9" r="5"/><circle cx="-5.7" cy="-1.9" r="5"/>
      <circle r="3" fill="#ff5fa8"/>
    </g>
    <ellipse id="leaf" rx="6" ry="3" fill="#256b4c" transform="rotate(-35)"/>
  </defs>
  <rect width="400" height="400" fill="#ddf0e3"/>
  <!-- tie straps, knotted at the shoulders -->
  <path d="M170 110 L162 72 M230 110 L238 72" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
