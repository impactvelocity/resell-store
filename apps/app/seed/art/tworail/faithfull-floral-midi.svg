  <circle cx="162" cy="72" r="6" fill="#ffffff"/>
  <circle cx="238" cy="72" r="6" fill="#ffffff"/>
  <!-- flowing skirt -->
  <path d="M170 166 Q200 172 230 166 C252 220 290 280 312 324 Q290 340 256 330 Q228 340 200 332 Q172 340 144 330 Q110 340 88 324 C110 280 148 220 170 166 Z" fill="#ffffff"/>
  <!-- fitted bodice -->
  <path d="M164 106 Q182 98 200 112 Q218 98 236 106 L232 170 Q200 178 168 170 Z" fill="#ffffff"/>
  <path d="M170 170 Q200 177 230 170" fill="none" stroke="#ddf0e3" stroke-width="4" stroke-linecap="round"/>
  <!-- flowers and leaves -->
  <use href="#pinkflower" x="186" y="130"/>
  <use href="#deepflower" x="216" y="152"/>
  <use href="#deepflower" x="190" y="196"/>
  <use href="#pinkflower" x="220" y="212"/>
  <use href="#pinkflower" x="164" y="240"/>
  <use href="#deepflower" x="236" y="256"/>
  <use href="#pinkflower" x="200" y="270"/>
  <use href="#deepflower" x="140" y="286"/>
  <use href="#pinkflower" x="266" y="296"/>
  <use href="#deepflower" x="176" y="312"/>
  <use href="#pinkflower" x="226" y="314"/>
  <use href="#pinkflower" x="110" y="318"/>
  <use href="#deepflower" x="290" y="320"/>
  <use href="#leaf" x="206" y="138"/>
