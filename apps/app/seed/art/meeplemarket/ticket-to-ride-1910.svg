  <path d="M148 250 L132 270 H150 Z" fill="#14261d" stroke="#14261d" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#14261d">
    <circle cx="170" cy="264" r="13"/><circle cx="204" cy="264" r="13"/><circle cx="250" cy="264" r="13"/>
  </g>
  <g fill="#fff6c2">
