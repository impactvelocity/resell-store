  <path d="M74 112 L122 78 H322 V280 L274 314 V112 Z" fill="#14261d" stroke="#14261d" stroke-width="6" stroke-linejoin="round"/>
  <!-- lid front -->
  <rect x="74" y="112" width="200" height="202" rx="6" fill="#14261d"/>
  <!-- edges between the faces -->
  <path d="M77 112 H274 V311 M274 112 L320 80" fill="none" stroke="#ffdceb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- title -->
  <rect x="94" y="130" width="96" height="10" rx="5" fill="#ffffff"/>
  <rect x="94" y="148" width="60" height="8" rx="4" fill="#ffffff"/>
  <!-- stone doorway -->
  <path d="M120 300 V214 Q120 166 174 166 Q228 166 228 214 V300 Z" fill="#c9246f"/>
  <!-- glowing light inside -->
  <path d="M146 300 V220 Q146 192 174 192 Q202 192 202 220 V300 Z" fill="#ffd934"/>
  <!-- stones -->
  <g fill="#256b4c">
    <rect x="164" y="170" width="20" height="16" rx="4"/>
    <rect x="124" y="204" width="18" height="22" rx="4"/>
    <rect x="206" y="204" width="18" height="22" rx="4"/>
    <rect x="124" y="250" width="18" height="24" rx="4"/>
    <rect x="206" y="250" width="18" height="24" rx="4"/>
    <rect x="96" y="278" width="20" height="22" rx="4"/>
    <rect x="232" y="278" width="20" height="22" rx="4"/>
  </g>
</svg>
