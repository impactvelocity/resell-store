<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#ffdceb"/>
  <g transform="translate(-10 0)">
  <!-- adjustable shoulder strap, behind, with its buckle -->
  <path d="M100 160 C100 72 140 52 190 52 C240 52 280 72 280 160" fill="none" stroke="#14261d" stroke-width="8" stroke-linecap="round"/>
  <rect x="91" y="92" width="18" height="26" rx="5" fill="#ffd934"/>
  <path d="M100 98 V112" fill="none" stroke="#14261d" stroke-width="4" stroke-linecap="round"/>
  <!-- top handle -->
  <path d="M154 150 C154 108 170 96 190 96 C210 96 226 108 226 150" fill="none" stroke="#14261d" stroke-width="16" stroke-linecap="round"/>
  <!-- strap rings -->
  <rect x="92" y="146" width="16" height="18" rx="5" fill="#ffd934"/>
  <rect x="272" y="146" width="16" height="18" rx="5" fill="#ffd934"/>
  <!-- body -->
  <path d="M94 156 H286 Q298 156 298 168 V318 Q298 330 286 330 H94 Q82 330 82 318 V168 Q82 156 94 156 Z" fill="#14261d"/>
  <!-- two slip pockets on the front -->
  <path d="M102 250 V304 Q102 312 110 312 H174 Q182 312 182 304 V250" fill="none" stroke="#ffdceb" stroke-width="3" stroke-linecap="round"/>
  <path d="M198 250 V304 Q198 312 206 312 H270 Q278 312 278 304 V250" fill="none" stroke="#ffdceb" stroke-width="3" stroke-linecap="round"/>
  <path d="M102 250 H182 M198 250 H278" fill="none" stroke="#ffdceb" stroke-width="3" stroke-linecap="round"/>
  <!-- flap with its leaf-green trim -->
  <path d="M84 224 H296" fill="none" stroke="#256b4c" stroke-width="6" stroke-linecap="round"/>
  <!-- buckled closure strap over the flap -->
  <rect x="181" y="186" width="18" height="82" rx="9" fill="#256b4c"/>
  <rect x="174" y="210" width="32" height="28" rx="6" fill="none" stroke="#ffd934" stroke-width="6"/>
  <path d="M190 212 V236" fill="none" stroke="#ffd934" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- duck fob hanging from the right ring -->
  <path d="M270 160 L300 200" fill="none" stroke="#ffd934" stroke-width="4" stroke-linecap="round"/>
  <path d="M286 236 C286 222 300 218 312 222 C320 224 326 218 332 212 C336 224 336 250 312 252 C296 254 286 248 286 236 Z" fill="#ffd934"/>
  <circle cx="300" cy="212" r="12" fill="#ffd934"/>
  <path d="M290 210 L278 214 L290 218 Z" fill="#ffd934" stroke="#ffd934" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="302" cy="209" r="2.5" fill="#14261d"/>
</svg>
