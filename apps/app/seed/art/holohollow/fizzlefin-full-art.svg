<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#ffdceb"/>
  <!-- the card, art edge to edge -->
  <rect x="110" y="74" width="180" height="252" rx="12" fill="#ddf0e3"/>
  <!-- water lines -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <path d="M126 100 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
    <path d="M126 262 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
    <path d="M126 284 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
  </g>
  <!-- Fizzlefin: tail and top fin -->
  <path d="M146 200 L120 174 Q114 200 120 226 Z" fill="#256b4c" stroke="#256b4c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M162 166 Q176 132 212 162 Z" fill="#256b4c"/>
