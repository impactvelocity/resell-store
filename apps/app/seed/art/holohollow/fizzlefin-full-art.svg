    <circle cx="242" cy="198" r="6"/>
    <circle cx="254" cy="176" r="9"/>
    <circle cx="262" cy="146" r="12"/>
    <circle cx="246" cy="118" r="7"/>
    <circle cx="266" cy="104" r="5"/>
